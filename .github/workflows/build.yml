{
"name": "Set up JDK 17",
"uses": "actions/setup-java@v4",
"with": { "java-version": "17", "distribution": "temurin" }
},
{
"name": "Generate Release Keystore",
"run": "keytool -genkeypair -v -keystore app/release.keystore -keyalg RSA -keysize 2048 -validity 10000 -alias egpcurrency -storepass egpcurrency123 -keypass egpcurrency123 -dname 'CN=Mohamed Badawy, O=SarfApp, C=EG'"
},
{
"name": "Set up Gradle",
"uses": "gradle/actions/setup-gradle@v4",
"with": { "gradle-version": "8.7" }
},
{
"name": "Build Protected Release APK",
"run": "gradle assembleRelease --no-daemon"
},
{
"name": "Upload Release APK",
"uses": "actions/upload-artifact@v4",
"with": { "name": "Sarf-Release-APK", "path": "app/build/outputs/apk/release/app-release.apk" }
}
]
}
