{
"name": "Set up JDK 17",
"uses": "actions/setup-java@v4",
"with": { "java-version": "17", "distribution": "temurin" }
},
{
"name": "Restore Persistent Keystore",
"env": { "KEYSTORE_BASE64": "{{ secrets.KEYSTORE_BASE64 }}" },
"run": "if [ -n \"$KEYSTORE_BASE64\" ]; then echo \"$KEYSTORE_BASE64\" | base64 -d > app/release.keystore; else echo 'WARNING: KEYSTORE_BASE64 secret not set, generating fallback keystore'; keytool -genkeypair -v -keystore app/release.keystore -keyalg RSA -keysize 2048 -validity 10000 -alias egpcurrency -storepass egpcurrency123 -keypass egpcurrency123 -dname 'CN=Mohamed Badawy, O=SarfApp, C=EG'; fi"
},
{
"name": "Set up Gradle",
"uses": "gradle/actions/setup-gradle@v4",
"with": { "gradle-version": "8.7" }
},
{
"name": "Build Signed Release APK & AAB",
"env": {
"KEYSTORE_STORE_PASS": "${{ secrets.KEYSTORE_STORE_PASS }}",
"KEYSTORE_KEY_ALIAS": "${{ secrets.KEYSTORE_KEY_ALIAS }}",
"KEYSTORE_KEY_PASS": "{{ secrets.KEYSTORE_KEY_PASS }}"
},
"run": "gradle assembleRelease bundleRelease --no-daemon"
},
{
"name": "Upload Release APK",
"uses": "actions/upload-artifact@v4",
"with": { "name": "Sarf-Release-APK", "path": "app/build/outputs/apk/release/app-release.apk" }
},
{
"name": "Upload Play Store AAB",
"uses": "actions/upload-artifact@v4",
"with": { "name": "Sarf-PlayStore-AAB", "path": "app/build/outputs/bundle/release/app-release.aab" }
}
]
}
}
}
