"name": "Generate Release Keystore",
"run": "keytool -genkeypair -v -keystore app/release.keystore -keyalg RSA -keysize 2048 -validity 10000 -alias egpcurrency -storepass egpcurrency123 -keypass egpcurrency123 -dname 'CN=Mohamed Badawy, O=EgpCurrency, C=EG'"
},
{
"name": "Set up Gradle",
"uses": "gradle/actions/setup-gradle@v4",
"with": { "gradle-version": "8.7" }
},
{
"name": "Build Protected Release APK",
